<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自然戰力覺醒｜學測自然知識挑戰遊戲</title>
<meta name="description" content="自然戰力覺醒：解鎖知識，挑戰你的自然實力！學測自然歷屆考點計時挑戰遊戲：極速賽、生存挑戰、單元特訓、雙人對決、錯題本與考點圖鑑。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1b3e; --bg2:#13265a; --panel:#182f6b; --panel2:#1f3a80; --line:#2c4a96;
  --ink:#f3f6ff; --mute:#a9b8e3; --gold:#ffd23f; --ok:#2ecc71; --bad:#ff5a5f;
  --bio:#3ddc84; --chem:#ff9f43; --phy:#4dabf7; --earth:#b197fc;
  --r:18px; --sh:0 6px 0 rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#24479b 0,var(--bg) 60%) fixed,var(--bg);color:var(--ink);
  font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px}
.hide{display:none!important}
h1,h2,h3{margin:0;line-height:1.25}

/* top bar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .back{background:var(--panel);border-radius:12px;padding:8px 14px;box-shadow:var(--sh);font-weight:700}
.top .ttl{font-weight:900;font-size:20px;flex:1}
.iconbtn{background:var(--panel);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;font-size:20px;box-shadow:var(--sh)}

/* hero */
.hero{text-align:center;padding:18px 8px 6px}
.hero .badge{display:inline-block;background:var(--gold);color:#3a2a00;font-weight:900;border-radius:999px;padding:4px 14px;font-size:14px;letter-spacing:.1em}
.hero h1{font-size:clamp(34px,7vw,58px);font-weight:900;margin:10px 0 4px;letter-spacing:.04em;
  background:linear-gradient(180deg,#fff 30%,#ffe27a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.hero p{color:var(--mute);margin:0}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.stat{background:var(--panel);border-radius:14px;padding:6px 14px;font-size:14px;color:var(--mute)}
.stat b{color:var(--ink);font-size:18px;margin-right:2px}

.namebox{display:flex;gap:8px;justify-content:center;align-items:center;margin:14px 0}
.namebox input{background:var(--bg2);border:2px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;padding:8px 12px;width:180px;text-align:center}

/* subject filter */
.filter{background:var(--panel);border-radius:var(--r);padding:12px;margin:12px 0}
.filter .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border-radius:999px;padding:7px 14px;font-weight:700;background:var(--bg2);border:2px solid var(--line);font-size:15px}
.chip.on{border-color:var(--gold);background:#3a3a10;color:var(--gold)}
.chip.s-bio.on{border-color:var(--bio);color:var(--bio);background:#0f3a28}
.chip.s-chem.on{border-color:var(--chem);color:var(--chem);background:#3d2810}
.chip.s-phy.on{border-color:var(--phy);color:var(--phy);background:#0f2c4a}
.chip.s-earth.on{border-color:var(--earth);color:var(--earth);background:#2a2150}
.filter .sum{color:var(--mute);font-size:14px;margin-left:auto}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.unit{display:flex;align-items:center;gap:6px;background:var(--bg2);border:2px solid transparent;border-radius:10px;padding:6px 8px;font-size:13px;text-align:left}
.unit.on{border-color:var(--gold)}
.unit img{width:28px;height:28px;border-radius:6px;object-fit:cover;flex:none;background:#0003}
.unit .bar{height:4px;background:#0004;border-radius:2px;margin-top:3px;overflow:hidden}
.unit .bar i{display:block;height:100%;background:var(--ok)}

/* modes */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:12px}
.mode{position:relative;text-align:left;border-radius:var(--r);padding:16px;box-shadow:var(--sh);min-height:120px;overflow:hidden;transition:transform .1s}
.mode:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mode .ic{font-size:34px}
.mode h3{font-size:20px;font-weight:900;margin:4px 0 2px}
.mode p{margin:0;font-size:14px;opacity:.9}
.m1{background:linear-gradient(135deg,#ff6b6b,#e8414f)}
.m2{background:linear-gradient(135deg,#f78fb3,#c44569)}
.m3{background:linear-gradient(135deg,#20bf6b,#0b8a4b)}
.m4{background:linear-gradient(135deg,#4b7bec,#3053c4)}
.m5{background:linear-gradient(135deg,#fa8231,#d35400)}
.m6{background:linear-gradient(135deg,#8854d0,#5f27cd)}
.m7{background:linear-gradient(135deg,#0fb9b1,#0a7f7a)}
.mode .cnt{position:absolute;right:12px;top:12px;background:#0005;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}

/* game HUD */
.hud{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
.hud .box{background:var(--panel);border-radius:14px;padding:6px 12px;text-align:center;min-width:76px;box-shadow:var(--sh)}
.hud .box small{display:block;color:var(--mute);font-size:12px}
.hud .box b{font-size:22px;font-weight:900}
.hud .grow{flex:1}
.timer{height:12px;background:#0005;border-radius:999px;overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--gold));border-radius:999px;transition:width .1s linear}
.timer.low i{background:var(--bad)}
.hearts{font-size:22px;letter-spacing:2px}
.combo{color:var(--gold)}
.qcard{background:#fff;color:#14213d;border-radius:22px;padding:20px 20px 18px;box-shadow:0 8px 0 rgba(0,0,0,.3);position:relative;min-height:130px}
.qcard .tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#fff;border-radius:999px;padding:3px 10px 3px 4px;margin-bottom:8px}
.qcard .tag img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:#fff3}
.qcard .q{font-size:clamp(19px,3.4vw,25px);font-weight:700}
.qcard .tfmark{display:inline-block;font-size:13px;font-weight:900;background:#14213d;color:#fff;border-radius:6px;padding:1px 8px;margin-right:6px;vertical-align:3px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:var(--panel2);border-radius:16px;padding:14px 14px 14px 48px;text-align:left;font-size:clamp(16px,2.6vw,19px);font-weight:500;position:relative;box-shadow:var(--sh);min-height:62px;transition:transform .08s,background .15s}
.opt:active{transform:translateY(3px)}
.opt .k{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;background:#0004;display:grid;place-items:center;font-weight:900;font-size:14px}
.opt.ok{background:var(--ok);color:#06351b}
.opt.no{background:var(--bad)}
.opt.dim{opacity:.45}
.opts.tf .opt{font-size:34px;font-weight:900;text-align:center;padding:12px}
.opts.tf .opt .k{display:none}
.feedback{margin-top:12px;border-radius:16px;padding:12px 14px;font-size:16px;background:var(--panel)}
.feedback.good{border-left:6px solid var(--ok)}
.feedback.bad{border-left:6px solid var(--bad)}
.feedback b{color:var(--gold)}
.next{display:block;width:100%;margin-top:10px;background:var(--gold);color:#3a2a00;font-weight:900;font-size:18px;border-radius:14px;padding:12px;box-shadow:var(--sh)}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:44px;font-weight:900;pointer-events:none;text-shadow:0 4px 0 #0007;animation:pop .7s ease-out forwards;z-index:50;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.countdown{position:fixed;inset:0;display:grid;place-items:center;background:#0d1b3ecc;z-index:60;font-size:120px;font-weight:900;color:var(--gold)}

/* results */
.result{text-align:center}
.result .big{font-size:64px;font-weight:900;color:var(--gold);line-height:1;margin:8px 0}
.result .stars{font-size:40px;letter-spacing:6px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.rgrid div{background:var(--panel);border-radius:14px;padding:8px}
.rgrid small{display:block;color:var(--mute)}
.rgrid b{font-size:22px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.btn{background:var(--panel2);border-radius:14px;padding:12px 18px;font-weight:900;box-shadow:var(--sh)}
.btn.gold{background:var(--gold);color:#3a2a00}
.list{text-align:left;margin-top:12px}
.item{background:var(--panel);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.item .uq{font-size:12px;color:var(--mute)}
.item .qq{font-weight:700}
.item .aa{color:var(--ok);font-weight:700}
.item .ee{color:var(--mute);font-size:14px}
.item .yourA{color:var(--bad);font-size:14px}
.newrec{display:inline-block;background:var(--bad);border-radius:999px;padding:2px 12px;font-weight:900;animation:pop2 1s infinite alternate}
@keyframes pop2{to{transform:scale(1.08)}}

/* leaderboard */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
table.lb{width:100%;border-collapse:collapse;background:var(--panel);border-radius:14px;overflow:hidden}
.lb th,.lb td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
.lb th{color:var(--mute);font-weight:500;font-size:13px}
.lb tr:first-child td{color:var(--gold);font-weight:900}

/* dex */
.search{width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;padding:10px 12px;margin-bottom:10px}
.dexunit{margin:16px 0 8px;display:flex;align-items:center;gap:10px}
.dexunit img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.dexunit h3{font-size:18px}

/* duel */
.duel{position:fixed;inset:0;display:grid;grid-template-rows:1fr auto 1fr;background:var(--bg);z-index:40}
.duel .half{padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.duel .half.p1{transform:rotate(180deg);background:linear-gradient(0deg,#3a1a2a,var(--bg))}
.duel .half.p2{background:linear-gradient(0deg,#102a4a,var(--bg))}
.duel .mid{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px;background:var(--bg2);font-weight:900}
.duel .pscore{display:flex;justify-content:space-between;align-items:center;font-weight:900}
.duel .pscore .sc{font-size:28px;color:var(--gold)}
.duel .dq{background:#fff;color:#14213d;border-radius:16px;padding:10px 14px;font-weight:700;font-size:clamp(15px,2.6vw,20px)}
.duel .opts{margin-top:0;flex:1;min-height:0}
.duel .opt{min-height:48px;padding:8px 10px 8px 40px;font-size:clamp(14px,2.4vw,17px)}
.duel .opts.tf .opt{font-size:28px;padding:6px}
.duel .lock{opacity:.35;pointer-events:none}
.duel .msg{font-size:15px;color:var(--gold);min-height:1.5em;text-align:center}
.duel .quit{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--panel);border-radius:10px;padding:4px 10px;font-size:13px}

/* 美術素材（有圖才顯示） */
.hero .banner{position:relative;aspect-ratio:16/9;max-height:520px;width:100%;border-radius:24px;overflow:visible;margin-bottom:14px;
  padding-top:clamp(10px,3vw,26px);box-shadow:0 8px 0 rgba(0,0,0,.3);
  background:linear-gradient(180deg,rgba(13,27,62,.82) 0%,rgba(13,27,62,.45) 26%,rgba(13,27,62,0) 46%),var(--heroimg) center/cover no-repeat}
.hero .banner h1{font-size:clamp(26px,6.4vw,60px);margin:clamp(4px,1vw,10px) 0 0}
.hero .banner .badge{font-size:clamp(11px,1.8vw,14px)}
.hero .banner .mascot{position:absolute;right:1.5%;bottom:-18px;width:clamp(70px,17%,150px);height:auto;margin:0}
.hero .mascot{width:110px;height:110px;object-fit:contain;display:block;margin:-6px auto 0;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.mode .mart{position:absolute;right:-6px;bottom:-8px;width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25));pointer-events:none}
.mode.hasart{padding-right:96px}
.mode h3 .cnt{position:static;display:inline-block;margin-left:8px;vertical-align:3px}
.mode.hasart .ic{display:none}
.chip .sic{width:20px;height:20px;object-fit:contain;vertical-align:-4px;margin-right:2px}
.feedback{display:flex;gap:10px;align-items:center}
.cls{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:6px;vertical-align:1px}.cls.a{background:#ff6b35;color:#fff}.cls.b{background:#22d3ee;color:#0b1430}
.feedback .fm{width:64px;height:64px;object-fit:contain;flex:none}
.result .trophy{width:140px;height:140px;object-fit:contain;display:block;margin:0 auto -6px;animation:bob 2.4s ease-in-out infinite}
.hero .slogan{color:var(--ink);font-size:clamp(15px,2.4vw,18px)}
.hero .slogan b{color:var(--gold);font-size:clamp(18px,3vw,24px);font-weight:900;letter-spacing:.03em}
.cta{text-align:center;font-weight:900;font-size:clamp(17px,2.8vw,22px);color:var(--gold);margin:18px 0 4px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.foot{color:var(--mute);font-size:13px;text-align:center;margin-top:24px}
.foot a{color:var(--mute)}
@media (max-width:560px){
  .opts{grid-template-columns:1fr}
  .opts.tf{grid-template-columns:1fr 1fr}
  .hud .box{min-width:60px;padding:4px 8px}
  .hud .box b{font-size:18px}
  .duel .opts{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const QB=[];
QB.push(
["P01","下列何者是國際單位制（SI）的基本量？","電流","電荷","電壓","能量","SI 七個基本量：時間、長度、質量、電流、熱力學溫度、物量、光強度；電學只有電流是基本量。","物理CH1"],
["P01","能量是物理最重要的概念，所以焦耳是 SI 的基本單位。",0,"焦耳＝kg·m²/s²，可由質量、長度、時間的單位導出，是導出單位。","物理CH1"],
["P09","電場定義為單位正電荷所受的靜電力，其 SI 單位為何？","N/C","C/N","N·C","V·A","單位從定義式推：電場＝力÷電量，單位為 N/C。","物理CH1"],
["P01","「奈米（nm）」的前綴詞 n 代表 10 的幾次方？","10⁻⁹","10⁻⁶","10⁻¹²","10⁻³","n（奈）＝10⁻⁹，µ（微）＝10⁻⁶，p（皮）＝10⁻¹²。","物理CH1"],
["P10","1820 年發現「通電導線可使附近磁針偏轉」的是誰？","厄斯特","法拉第","安培","馬克士威","厄斯特發現電流磁效應（電生磁），首次聯結電與磁。","物理CH1"],
["P10","首先以實驗發現電磁感應（磁生電）的科學家是？","法拉第","厄斯特","赫茲","冷次","法拉第 1831 年發現電磁感應，並製作第一部發電機。","物理CH1"],
["P10","以數學整合電磁理論，預測電磁波並推論光是電磁波的是？","馬克士威","赫茲","法拉第","愛因斯坦","馬克士威理論預測電磁波、推論光是電磁波；赫茲後來以實驗證實。","物理CH1"],
["P11","原子大小的數量級約為多少公尺？","10⁻¹⁰ m","10⁻¹⁵ m","10⁻⁶ m","10⁻¹⁸ m","原子約 10⁻¹⁰ m（1 Å），原子核約 10⁻¹⁵ m。","物理CH2"],
["P11","湯姆森以下列哪一實驗發現電子？","氣體放電管（陰極射線）","α粒子撞擊金箔","α粒子撞擊鈹","光照射金屬板","1897 年湯姆森改良氣體放電管，發現各種氣體都會撞出相同的帶負電粒子：電子。","物理CH2"],
["P11","拉塞福提出原子核模型，是根據哪個實驗？","α粒子撞擊金屬薄片","電子撞擊氫原子","陰極射線偏折","電子撞擊質子","α 粒子散射實驗中少數粒子大角度偏折甚至反彈，推論出原子核。","物理CH2"],
["P11","拉塞福的散射實驗是用高速電子撞擊金箔。",0,"入射粒子是帶正電的 α 粒子（氦原子核），不是電子。","物理CH2"],
["P11","α 粒子散射時少數被大角度反彈，說明了什麼？","質量與正電集中於極小的核","電子均勻散布在原子中","原子內充滿均勻正電物質","原子核由質子和中子組成","原子大部分是空的，幾乎全部質量與正電荷集中在中心極小的原子核。","物理CH2"],
["P11","氫原子核半徑約為氫原子半徑的多少？","十萬分之一","百分之一","千分之一","十億分之一","氫原子核約 1 fm＝10⁻¹⁵ m，約為原子半徑的十萬分之一。","物理CH2"],
["P11","原子核的尺度約為 10⁻¹⁵ m（飛米級）。",1,"1 fm＝10⁻¹⁵ m，原子核內質子間距也在此數量級。","物理CH2"],
["P11","碳-14（原子序 6）的原子核含有幾個中子？","8","6","14","20","中子數＝質量數－質子數＝14－6＝8。","物理CH2"],
["P11","原子序等於原子核內的核子（質子＋中子）總數。",0,"原子序＝質子數（＝中性原子的電子數）；質子＋中子是質量數。","物理CH2"],
["P11","原子核的「質量數」定義為何？","質子數＋中子數","質子數＋電子數","中子數＋電子數","質子數的兩倍","電子質量極小，原子質量幾乎全在核內，故以質子數加中子數為質量數。","物理CH2"],
["P05","兩質點距離變為 2 倍，萬有引力變為原來的幾倍？","¼ 倍","½ 倍","2 倍","4 倍","萬有引力 F＝Gm₁m₂/r²，與距離平方成反比。","物理CH2"],
["P05","萬有引力的量值與兩質點質量的「和」成正比。",0,"萬有引力與兩質量的「乘積」成正比，與距離平方成反比。","物理CH2"],

const mastered=q=>{const s=S[q.id];return s&&s.s>=2};

/* ========= 音效 ========= */
/* ========= 音效：WebAudio 即時合成的對戰風音效（不需要音檔） ========= */
let AC,MASTER,NOISE,BUS;
function sfxInit(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
  MASTER=AC.createGain();MASTER.gain.value=.55;MASTER.connect(comp);comp.connect(AC.destination);
  const len=AC.sampleRate;NOISE=AC.createBuffer(1,len,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}
function tone(f,dur,{type="square",f2=0,at=0,vol=.2,attack=.005}={}){const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(BUS||MASTER);o.start(t);o.stop(t+dur+.02)}
function noise(dur,{at=0,vol=.3,type="bandpass",f=2000,f2=0,q=1}={}){const t=AC.currentTime+at,src=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=NOISE;fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(fl);fl.connect(g);g.connect(BUS||MASTER);src.start(t);src.stop(t+dur+.02)}
const kick=(at=0,vol=.6)=>tone(150,.25,{type:"sine",f2:40,at,vol});
const SFX={
  click(){tone(1400,.035,{type:"triangle",vol:.1});tone(2100,.03,{type:"triangle",vol:.05,at:.02})},          // 按鈕
  tick(){kick(0,.55);tone(1500,.05,{vol:.07})},                                                                 // 倒數 3、2、1
  go(){noise(.45,{f:400,f2:6000,vol:.16,q:.7});kick(.42,.85);noise(.35,{at:.42,type:"lowpass",f:3000,f2:200,vol:.45}); // FIGHT!
    [523,659,784,1047].forEach(f=>tone(f,.55,{type:"sawtooth",at:.42,vol:.06}))},
  ok(c=1){const up=Math.pow(2,Math.min(c-1,9)/6);                                                               // 揮劍命中，連對越多音越高
    noise(.12,{type:"highpass",f:2500,f2:9000,vol:.2});tone(880*up,.08,{at:.03,vol:.09});tone(1320*up,.2,{at:.1,vol:.08})},
  combo(){[0,4,7,12,16,19].forEach((st,i)=>tone(660*Math.pow(2,st/12),.12,{type:"sawtooth",at:i*.05,vol:.07}));      // 連擊升級
    noise(.45,{at:.28,type:"highpass",f:6000,vol:.08})},
  bad(){kick(0,.75);tone(190,.3,{type:"sawtooth",f2:70,vol:.16});noise(.2,{type:"lowpass",f:900,vol:.3})},       // 被擊中
  life(){kick(0,.85);noise(.35,{f:1800,f2:300,vol:.35,q:2});tone(392,.15,{at:.05,vol:.09});tone(311,.4,{at:.2,vol:.09})}, // 失去一條命
  timeup(){tone(1000,.5,{type:"triangle",f2:200,vol:.16});kick(.05,.5)},                                        // 時間到
  warn(){tone(110,.11,{type:"sine",vol:.55});tone(105,.12,{type:"sine",vol:.38,at:.15})},                       // 心跳警告
  lock(){tone(300,.12,{f2:150,vol:.14});noise(.08,{f:1200,vol:.2})},                                            // 對決答錯鎖住
  end(){[523,659,784].forEach((f,i)=>tone(f,.16,{at:i*.11,vol:.08}));kick(.36,.6);                              // 結算
    [523,659,784,1047].forEach(f=>tone(f,.9,{type:"sawtooth",at:.36,vol:.045}));noise(.8,{at:.36,type:"highpass",f:5000,vol:.06})},
  record(){SFX.end();[1047,1319,1568,2093].forEach((f,i)=>tone(f,.16,{at:1.05+i*.08,vol:.07}));noise(1,{at:1.05,type:"highpass",f:7000,vol:.07})} // 新紀錄、對決勝利
};
/* 各音效音量平衡（以實測峰值校正：按鈕最輕，答對、被擊中、結算較響） */
const SFX_LV={click:15,tick:3.7,go:.9,ok:10,combo:3,bad:3.6,life:4,timeup:1.8,warn:1.7,lock:14,end:1.3,record:1.3};
function beep(type,arg){if(!PREF.sound)return;try{sfxInit();if(AC.state==="suspended")AC.resume();
  BUS=AC.createGain();BUS.gain.value=SFX_LV[type]||1;BUS.connect(MASTER);(SFX[type]||SFX.click)(arg)}catch(e){}finally{BUS=null}}
document.addEventListener("click",ev=>{const b=ev.target.closest("button,.chip,a.btn");if(b&&!b.classList.contains("opt")&&b.id!=="snd")beep("click")},true);

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const app=$("#app");
let timers=[];const clearTimers=()=>{timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[]};
function popText(txt,color){const d=document.createElement("div");d.className="pop";d.textContent=txt;d.style.color=color;document.body.appendChild(d);setTimeout(()=>d.remove(),750)}
function activeUnits(){if(PREF.units&&PREF.units.length)return PREF.units;
  if(PREF.subj&&PREF.subj!=="all")return SUBJ[PREF.subj].u;return Object.keys(UNITS)}
function pool(units){const set=new Set(units||activeUnits());const vs=PREF.vols||[];
  return Q.filter(q=>set.has(q.u)&&(!vs.length||q.yrs.some(y=>vs.includes(String(y)))))}
/* 加權抽題：錯過的題、沒看過的題較常出現，已熟練的較少 */
function weightOf(q){const s=S[q.id];if(!s)return 3;if(BOOK.has(q.id))return 5;if(s.s>=3)return .6;if(s.s>=2)return 1.2;return 2}
function makeDeck(list){const arr=list.map(q=>({q,k:Math.pow(Math.random(),1/weightOf(q))}));arr.sort((a,b)=>b.k-a.k);return arr.map(x=>x.q)}
function optionsOf(q){return q.tf?["O","X"]:shuffle([q.a,...q.w])}
function tagHTML(q){const sj=SUBJ[subjOf(q.u)];return `<span class="tag" style="background:${sj.c}"><img src="${ART(q.u)}" alt="" onerror="this.style.display='none'">${sj.n}｜${UNITS[q.u]}｜${esc(q.src)}</span>`}
function unitProgress(u){const l=Q.filter(q=>q.u===u);return Math.round(l.filter(mastered).length/l.length*100)}

/* ========= 單人遊戲 ========= */
let G;
function startGame(mode){
  let list=mode==="review"?Q.filter(q=>BOOK.has(q.id)):pool();
  if(!list.length){alert("出題範圍沒有題目");return}
  G={mode,deck:makeDeck(list),i:0,score:0,combo:0,maxCombo:0,right:0,wrong:0,missed:[],answered:0,
     time:60,lives:3,limit:12,qTime:0,locked:false,total:mode==="practice"||mode==="review"?Math.min(15,list.length):Infinity};
  countdown(()=>{if(mode==="speed"){G.end=Date.now()+60000;timers.push(setInterval(speedTick,100))}nextQ()});
}
function countdown(cb){const d=document.createElement("div");d.className="countdown";document.body.appendChild(d);let n=3;
  const step=()=>{if(n===0){d.textContent="GO!";beep("go");setTimeout(()=>{d.remove();cb()},400);return}d.textContent=n;beep("tick");n--;setTimeout(step,600)};step()}
function speedTick(){const left=Math.max(0,G.end-Date.now());G.time=left/1000;const t=$("#tbar");
  if(t){t.style.width=(left/600)+"%";t.parentElement.classList.toggle("low",left<10000)}
  const tb=$("#tval");if(tb)tb.textContent=Math.ceil(G.time);
  {const sec=Math.ceil(left/1000);if(left<10000&&left>0&&sec!==G.warnS){G.warnS=sec;beep("warn")}}
  if(left<=0)finish()}
function hudHTML(){const m=G.mode;let left="";
  if(m==="speed")left=`<div class="box"><small>時間</small><b id="tval">${Math.ceil(G.time)}</b></div>`;
  if(m==="survive")left=`<div class="box"><small>生命</small><b class="hearts">${"❤️".repeat(G.lives)}${"🤍".repeat(3-G.lives)}</b></div>`;
  if(m==="practice"||m==="review")left=`<div class="box"><small>題數</small><b>${G.i+1}/${G.total}</b></div>`;
  return `<div class="top"><button class="back" id="quit">✕ 離開</button><div class="ttl">${MODES[m]}</div></div>
  <div class="hud">${left}<div class="box"><small>分數</small><b>${G.score}</b></div><div class="box grow"><small>連對</small><b class="combo">${G.combo>1?"🔥×"+G.combo:"—"}</b></div>
  <div class="box"><small>答對</small><b>${G.right}</b></div></div>`}
function nextQ(){
  if(G.i>=G.total||(G.mode==="survive"&&G.lives<=0))return finish();
  if(G.i>=G.deck.length)G.deck=G.deck.concat(makeDeck(G.deck.slice(0,G.deck.length)));
  const q=G.deck[G.i];G.cur=q;G.opts=optionsOf(q);G.locked=false;
  const timed=G.mode!=="speed";
  if(G.mode==="survive")G.limit=Math.max(5,12-G.right*.3);
  const lim=G.mode==="survive"?G.limit:20;
  app.innerHTML=hudHTML()+`<div class="timer" ${G.mode==="speed"?"":"id='qt'"}><i id="tbar" style="width:100%"></i></div>
  <div class="qcard" id="qc">${tagHTML(q)}<div class="q">${q.tf?'<span class="tfmark">是非</span>':""}${esc(q.q)}</div></div>
  <div class="opts ${q.tf?"tf":""}" id="opts">${G.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span>${q.tf?(o==="O"?"⭕":"❌"):esc(o)}</button>`).join("")}</div>
  <div id="fb"></div>`;
  $("#quit").onclick=()=>{if(confirm("確定要離開這一局嗎？")){clearTimers();home()}};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  if(timed){G.qEnd=Date.now()+lim*1000;G.warnQ=0;const id=setInterval(()=>{if(G.locked)return;const left=G.qEnd-Date.now();
      const bar=$("#tbar");if(bar){bar.style.width=Math.max(0,left/(lim*10))+"%";bar.parentElement.classList.toggle("low",left<3000)}
      {const sec=Math.ceil(left/1000);if(left<3000&&left>0&&sec!==G.warnQ){G.warnQ=sec;beep("warn")}}
      if(left<=0){clearInterval(id);answer(-1)}},100);timers.push(id);G.qTimer=id}
  if(G.mode==="speed")speedTick();
}
function answer(i){if(G.locked)return;G.locked=true;if(G.qTimer){clearInterval(G.qTimer);G.qTimer=null}
  const q=G.cur,picked=i>=0?G.opts[i]:null,ok=picked===q.a;G.answered++;
  record(q,ok);save();
  const btns=app.querySelectorAll(".opt");btns.forEach((b,j)=>{const o=G.opts[j];if(o===q.a)b.classList.add("ok");else if(j===i)b.classList.add("no");else b.classList.add("dim")});
  if(ok){G.right++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);const bonus=Math.min(G.combo-1,5)*20;let pts=100+bonus;
    if(G.mode==="survive")pts+=Math.round(Math.max(0,G.qEnd-Date.now())/100);
    G.score+=pts;beep("ok",G.combo);if([3,5,10,15,20].includes(G.combo))setTimeout(()=>beep("combo"),170);popText(G.combo>2?`+${pts} 🔥${G.combo}`:`+${pts}`,"var(--gold)")}
  else{G.wrong++;G.combo=0;G.missed.push({q,picked});beep(i<0?"timeup":G.mode==="survive"?"life":"bad");$("#qc").classList.add("shake");
    if(G.mode==="speed"){G.end-=3000;popText("−3 秒","var(--bad)")}
    if(G.mode==="survive"){G.lives--;popText(i<0?"時間到！":"💔","var(--bad)")}}
  const ansTxt=q.tf?(q.a==="O"?"⭕ 正確":"❌ 錯誤"):q.a;
  const fb=$("#fb");
  const showExp=G.mode==="practice"||G.mode==="review"||!ok;
  if(showExp)fb.innerHTML=`<div class="feedback ${ok?"good":"bad"}">${artTag(ok?"mascot_happy":"mascot_oops","fm")}<div>${ok?"答對了！":"正解："+`<b>${esc(ansTxt)}</b>`}<br>📌 ${esc(q.e)}${q.yrs.length?`<br>${clsTag(q)}<span style="color:var(--gold);font-size:14px">${yrsTxt(q)}</span>`:""}</div></div>`;
  // 更新 HUD
  const hud=app.querySelector(".hud");if(hud){const tmp=document.createElement("div");tmp.innerHTML=hudHTML();hud.replaceWith(tmp.querySelector(".hud"));
    const t=document.querySelector(".top");t.replaceWith(tmp.querySelector(".top"));$("#quit").onclick=()=>{if(confirm("確定要離開這一局嗎？")){clearTimers();home()}}}
  G.i++;
  if(G.mode==="practice"||G.mode==="review"){fb.insertAdjacentHTML("beforeend",`<button class="next" id="nx">${G.i>=G.total?"看結果":"下一題 ➜"}（Enter）</button>`);$("#nx").onclick=nextQ;$("#nx").focus()}
  else if(G.mode==="speed"){const t=setTimeout(nextQ,ok?350:1600);timers.push(t)}
  else{const t=setTimeout(nextQ,ok?500:2000);timers.push(t)}
}
document.addEventListener("keydown",e=>{
  if(DUEL){const map={"1":[0,0],"2":[0,1],"3":[0,2],"4":[0,3],"7":[1,0],"8":[1,1],"9":[1,2],"0":[1,3]};const m=map[e.key];if(m)duelAnswer(m[0],m[1]);return}
  if(!G||!$("#opts"))return;
  if(e.key==="Enter"&&$("#nx")){e.preventDefault();$("#nx").click();return}
  let k=e.key.toLowerCase();if(G.cur&&G.cur.tf){if(k==="o")k="1";if(k==="x")k="2"}
  const n=parseInt(k,10);if(n>=1&&n<=G.opts.length)answer(n-1)});

function finish(){clearTimers();if(!G||G.done)return;G.done=true;
  const acc=G.answered?Math.round(G.right/G.answered*100):0;
  let stars="";if(G.mode==="practice"||G.mode==="review"){const n=acc>=90?3:acc>=70?2:acc>=40?1:0;stars=`<div class="stars">${"⭐".repeat(n)}${"☆".repeat(3-n)}</div>`}
  let rec="";const name=PREF.name||"無名英雄";
  if(G.mode==="speed"||G.mode==="survive"){const key=G.mode+"|"+(PREF.units.length?"自選":PREF.subj);
    const arr=LB[key]||(LB[key]=[]);const best=arr.length?arr[0].s:0;
    arr.push({n:name,s:G.score,r:G.right,a:acc,d:new Date().toLocaleDateString("zh-TW")});arr.sort((a,b)=>b.s-a.s);LB[key]=arr.slice(0,10);save();
    if(G.score>best&&G.score>0)rec=`<div><span class="newrec">🎉 新紀錄！</span></div>`}
  beep(rec?"record":"end");
  const scopeName=PREF.units.length?`自選 ${PREF.units.length} 單元`:(PREF.subj==="all"?"全部範圍":SUBJ[PREF.subj].n);
  app.innerHTML=`<div class="top"><button class="back" id="hm">🏠 首頁</button><div class="ttl">${MODES[G.mode]}・${G.mode==="review"?"錯題本":scopeName}</div></div>
  <div class="result">${artTag("mascot_trophy","trophy")}${rec}${stars}<div class="big">${G.score}</div><div style="color:var(--mute)">${esc(name)} 的得分</div>
  <div class="rgrid"><div><small>答對</small><b>${G.right}</b></div><div><small>正確率</small><b>${acc}%</b></div><div><small>最高連對</small><b>${G.maxCombo}</b></div></div>
  <div class="btnrow"><button class="btn gold" id="again">🔁 再玩一次</button>${BOOK.size?`<button class="btn" id="rev">📕 練錯題（${BOOK.size}）</button>`:""}<button class="btn" id="hm2">選其他模式</button></div>
  ${G.missed.length?`<h3 style="text-align:left;margin-top:18px">這局要記住的考點（${G.missed.length}）</h3><div class="list">${G.missed.map(m=>itemHTML(m.q,m.picked)).join("")}</div>`:`<p>全部答對，太強了！</p>`}</div>`;
  $("#hm").onclick=$("#hm2").onclick=home;$("#again").onclick=()=>startGame(G.mode);
  if($("#rev"))$("#rev").onclick=()=>startGame("review");
}
function itemHTML(q,picked){const ans=q.tf?(q.a==="O"?"⭕ 正確":"❌ 錯誤"):q.a;
  return `<div class="item"><div class="uq">${SUBJ[subjOf(q.u)].n}｜${UNITS[q.u]}｜${esc(q.src)}</div><div class="qq">${q.tf?"【是非】":""}${esc(q.q)}</div>
  <div class="aa">✔ ${esc(ans)}</div>${q.yrs.length?`<div class="uq" style="color:var(--gold)">${clsTag(q)}${yrsTxt(q)}</div>`:""}${picked!==undefined?`<div class="yourA">${picked===null?"⏰ 時間到":"✘ 你選："+esc(q.tf?(picked==="O"?"⭕":"❌"):picked)}</div>`:""}<div class="ee">📌 ${esc(q.e)}</div></div>`}

/* ========= 排行榜 ========= */
function board(tab){const keys=Object.keys(LB);tab=tab||keys[0];
  const label=k=>{const [m,s]=k.split("|");return MODES[m]+"・"+(s==="all"?"全部":s==="自選"?"自選":SUBJ[s].n)};
  app.innerHTML=`<div class="top"><button class="back" id="hm">🏠 首頁</button><div class="ttl">🏆 排行榜</div></div>
  ${keys.length?`<div class="tabs">${keys.map(k=>`<button class="chip ${k===tab?"on":""}" data-k="${k}">${label(k)}</button>`).join("")}</div>
  <table class="lb"><tr><th>名次</th><th>玩家</th><th>分數</th><th>答對</th><th>正確率</th><th>日期</th></tr>
  ${LB[tab].map((r,i)=>`<tr><td>${["🥇","🥈","🥉"][i]||i+1}</td><td>${esc(r.n)}</td><td>${r.s}</td><td>${r.r}</td><td>${r.a}%</td><td>${r.d}</td></tr>`).join("")}</table>
  <div class="btnrow"><button class="btn" id="clr">清除排行榜</button></div>`:`<p style="text-align:center;color:var(--mute)">還沒有紀錄，玩一場「極速 60 秒」或「生存挑戰」吧！</p>`}`;
  $("#hm").onclick=home;app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>board(b.dataset.k));
  if($("#clr"))$("#clr").onclick=()=>{if(confirm("確定清除這台裝置的所有排行榜紀錄？")){LB={};save();board()}}}

/* ========= 考點圖鑑 ========= */
function dex(){app.innerHTML=`<div class="top"><button class="back" id="hm">🏠 首頁</button><div class="ttl">📖 考點圖鑑</div></div>
  <input class="search" id="kw" placeholder="搜尋關鍵字，例如：滲透、凸透鏡、黑潮"><div id="dl"></div>`;
  $("#hm").onclick=home;const draw=()=>{const kw=$("#kw").value.trim();const units=activeUnits();let h="";
    const P=pool();for(const u of units){const l=P.filter(q=>q.u===u&&(!kw||(q.q+q.a+q.e).includes(kw)));if(!l.length)continue;
      h+=`<div class="dexunit"><img src="${ART(u)}" alt="" onerror="this.style.display='none'"><h3>${u.slice(1)}｜${UNITS[u]}</h3><span style="color:var(--mute);font-size:13px">熟練 ${unitProgress(u)}%</span></div>`+l.map(q=>itemHTML(q)).join("")}
    $("#dl").innerHTML=h||`<p style="color:var(--mute)">找不到符合的考點（目前範圍：${PREF.units.length?"自選單元":PREF.subj==="all"?"全部":SUBJ[PREF.subj].n}）</p>`};
  $("#kw").oninput=draw;draw()}

/* ========= 雙人對決 ========= */
let DUEL=null;
function duelStart(){const list=pool();if(!list.length)return;
  DUEL={deck:makeDeck(list),i:0,sc:[0,0],win:10,lock:[false,false],done:false};
  const el=document.createElement("div");el.className="duel";el.id="duel";
  const half=p=>`<div class="half p${p+1}"><div class="pscore"><span>${p?"🔵 玩家 2":"🔴 玩家 1"}</span><span class="sc" id="sc${p}">0</span></div>
    <div class="dq" id="dq${p}"></div><div class="opts" id="do${p}"></div><div class="msg" id="dm${p}"></div></div>`;
  el.innerHTML=half(0)+`<div class="mid" style="position:relative"><span>先拿 ${DUEL.win} 分獲勝</span><span id="dround"></span><button class="quit" id="dquit">離開</button></div>`+half(1);
  document.body.appendChild(el);document.body.style.overflow="hidden";
  $("#dquit").onclick=()=>duelEnd(true);
  countdown(duelNext)}
function duelNext(){if(!DUEL)return;clearTimers();
  if(DUEL.i>=DUEL.deck.length)DUEL.deck=DUEL.deck.concat(makeDeck(DUEL.deck));
  const q=DUEL.deck[DUEL.i++];DUEL.q=q;DUEL.opts=optionsOf(q);DUEL.lock=[false,false];DUEL.open=true;
  $("#dround").textContent=`第 ${DUEL.i} 題`;
  for(const p of [0,1]){$("#dq"+p).innerHTML=`${q.tf?'<span class="tfmark">是非</span>':""}${esc(q.q)}`;
    const o=$("#do"+p);o.className="opts"+(q.tf?" tf":"");
    o.innerHTML=DUEL.opts.map((x,i)=>`<button class="opt" data-i="${i}"><span class="k">${p?[7,8,9,0][i]:i+1}</span>${q.tf?(x==="O"?"⭕":"❌"):esc(x)}</button>`).join("");
    o.querySelectorAll(".opt").forEach(b=>b.onclick=()=>duelAnswer(p,+b.dataset.i));$("#dm"+p).textContent=""}
  timers.push(setTimeout(()=>duelReveal(null),15000))}
function duelAnswer(p,i){if(!DUEL||!DUEL.open||DUEL.lock[p]||i>=DUEL.opts.length)return;const q=DUEL.q;
  if(DUEL.opts[i]===q.a){DUEL.sc[p]++;$("#sc"+p).textContent=DUEL.sc[p];beep("ok");record(q,true);save();duelReveal(p)}
  else{DUEL.lock[p]=true;beep("lock");$("#do"+p).querySelectorAll(".opt")[i].classList.add("no");$("#do"+p).classList.add("lock");$("#dm"+p).textContent="答錯了，這題鎖住！";
    if(DUEL.lock[0]&&DUEL.lock[1]){record(q,false);save();duelReveal(null)}}}
function duelReveal(winner){if(!DUEL||!DUEL.open)return;DUEL.open=false;clearTimers();const q=DUEL.q;
  for(const p of [0,1]){const o=$("#do"+p);o.classList.remove("lock");o.querySelectorAll(".opt").forEach((b,j)=>{if(DUEL.opts[j]===q.a)b.classList.add("ok");else if(!b.classList.contains("no"))b.classList.add("dim")});
    $("#dm"+p).textContent=(winner===p?"🎉 搶答成功！ ":winner===null?"沒人答對 ":"對手先答對 ")+"📌 "+q.e}
  if(DUEL.sc[0]>=DUEL.win||DUEL.sc[1]>=DUEL.win){timers.push(setTimeout(()=>duelEnd(false),2600));return}
  timers.push(setTimeout(duelNext,3200))}
function duelEnd(quit){clearTimers();const d=DUEL;DUEL=null;const el=$("#duel");if(el)el.remove();document.body.style.overflow="";
  if(quit||!d){home();return}beep("record");const w=d.sc[0]>d.sc[1]?"🔴 玩家 1":"🔵 玩家 2";
  app.innerHTML=`<div class="top"><button class="back" id="hm">🏠 首頁</button><div class="ttl">⚔️ 雙人對決</div></div>
  <div class="result">${artTag("mascot_trophy","trophy")}<div class="big">${w} 獲勝！</div><div class="rgrid" style="grid-template-columns:1fr 1fr"><div><small>🔴 玩家 1</small><b>${d.sc[0]}</b></div><div><small>🔵 玩家 2</small><b>${d.sc[1]}</b></div></div>
  <div class="btnrow"><button class="btn gold" id="again">🔁 再戰一回</button><button class="btn" id="hm2">回首頁</button></div></div>`;
  $("#hm").onclick=$("#hm2").onclick=home;$("#again").onclick=duelStart}

home();
</script>
</body>
